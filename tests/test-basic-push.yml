name: Test basic push scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert CI_REF is set and non-empty
        run: |
          echo "CI_REF: $CI_REF"
          if [ -z "$CI_REF" ]; then
            echo "FAIL: expected CI_REF to be non-empty"
            exit 1
          fi
          echo "PASS: CI_REF=$CI_REF"
      - name: Assert CI_REF_NAME is set and non-empty
        run: |
          echo "CI_REF_NAME: $CI_REF_NAME"
          if [ -z "$CI_REF_NAME" ]; then
            echo "FAIL: expected CI_REF_NAME to be non-empty"
            exit 1
          fi
          echo "PASS: CI_REF_NAME=$CI_REF_NAME"
      - name: Assert CI_REF_NAME_SLUG is set and non-empty
        run: |
          echo "CI_REF_NAME_SLUG: $CI_REF_NAME_SLUG"
          if [ -z "$CI_REF_NAME_SLUG" ]; then
            echo "FAIL: expected CI_REF_NAME_SLUG to be non-empty"
            exit 1
          fi
          echo "PASS: CI_REF_NAME_SLUG=$CI_REF_NAME_SLUG"
      - name: Assert CI_REF_SLUG is set and non-empty
        run: |
          echo "CI_REF_SLUG: $CI_REF_SLUG"
          if [ -z "$CI_REF_SLUG" ]; then
            echo "FAIL: expected CI_REF_SLUG to be non-empty"
            exit 1
          fi
          echo "PASS: CI_REF_SLUG=$CI_REF_SLUG"
      - name: Assert CI_ACTION_REF_NAME is set and non-empty
        run: |
          echo "CI_ACTION_REF_NAME: $CI_ACTION_REF_NAME"
          if [ -z "$CI_ACTION_REF_NAME" ]; then
            echo "FAIL: expected CI_ACTION_REF_NAME to be non-empty"
            exit 1
          fi
          echo "PASS: CI_ACTION_REF_NAME=$CI_ACTION_REF_NAME"
      - name: Assert CI_EVENT_NAME is set and non-empty
        run: |
          echo "CI_EVENT_NAME: $CI_EVENT_NAME"
          if [ -z "$CI_EVENT_NAME" ]; then
            echo "FAIL: expected CI_EVENT_NAME to be non-empty"
            exit 1
          fi
          echo "PASS: CI_EVENT_NAME=$CI_EVENT_NAME"
      - name: Assert CI_REF contains refs/heads prefix (act-harness branch)
        run: |
          echo "CI_REF: $CI_REF"
          if ! echo "$CI_REF" | grep -q "^refs/heads/"; then
            echo "FAIL: expected CI_REF to start with refs/heads/, got '$CI_REF'"
            exit 1
          fi
          echo "PASS: CI_REF starts with refs/heads/"
      - name: Assert CI_REF_NAME matches last segment of CI_REF
        run: |
          echo "CI_REF: $CI_REF"
          echo "CI_REF_NAME: $CI_REF_NAME"
          EXPECTED_NAME="${CI_REF#refs/heads/}"
          if [ "$CI_REF_NAME" != "$EXPECTED_NAME" ]; then
            echo "FAIL: expected CI_REF_NAME='$EXPECTED_NAME', got '$CI_REF_NAME'"
            exit 1
          fi
          echo "PASS: CI_REF_NAME matches"
