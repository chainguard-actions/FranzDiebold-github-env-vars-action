name: Test pull request scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_SHA: ffac537e6cbbf934b08745a378932722df287a53
      GITHUB_HEAD_REF: feat/feature-branch-1
      GITHUB_BASE_REF: main
      GITHUB_ACTOR: octocat
      GITHUB_EVENT_NAME: pull_request
      GITHUB_RUN_ID: "397746731"
      GITHUB_RUN_NUMBER: "73"
      GITHUB_WORKFLOW: Demo
      GITHUB_ACTION: run2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_REF: refs/pull/42/merge
          GITHUB_SHA: ffac537e6cbbf934b08745a378932722df287a53
          GITHUB_HEAD_REF: feat/feature-branch-1
          GITHUB_BASE_REF: main
          GITHUB_ACTOR: octocat
          GITHUB_EVENT_NAME: pull_request
          GITHUB_RUN_ID: "397746731"
          GITHUB_RUN_NUMBER: "73"
          GITHUB_WORKFLOW: Demo
          GITHUB_ACTION: run2

      - name: Assert CI_REF_SLUG is set and slug-formatted
        run: |
          echo "CI_REF_SLUG=$CI_REF_SLUG"
          if [ -z "$CI_REF_SLUG" ]; then
            echo "FAIL: CI_REF_SLUG is empty"
            exit 1
          fi
          if echo "$CI_REF_SLUG" | grep -qE '[^a-z0-9-]'; then
            echo "FAIL: CI_REF_SLUG contains invalid characters: $CI_REF_SLUG"
            exit 1
          fi
          echo "PASS"

      - name: Assert CI_REF_NAME is set
        run: |
          echo "CI_REF_NAME=$CI_REF_NAME"
          if [ -z "$CI_REF_NAME" ]; then
            echo "FAIL: CI_REF_NAME is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert CI_REF_NAME_SLUG is set and slug-formatted
        run: |
          echo "CI_REF_NAME_SLUG=$CI_REF_NAME_SLUG"
          if [ -z "$CI_REF_NAME_SLUG" ]; then
            echo "FAIL: CI_REF_NAME_SLUG is empty"
            exit 1
          fi
          if echo "$CI_REF_NAME_SLUG" | grep -qE '[^a-z0-9-]'; then
            echo "FAIL: CI_REF_NAME_SLUG contains invalid characters: $CI_REF_NAME_SLUG"
            exit 1
          fi
          echo "PASS"

      - name: Log CI_HEAD_REF value
        run: |
          echo "CI_HEAD_REF=$CI_HEAD_REF"
          echo "PASS (informational)"

      - name: Log CI_HEAD_REF_SLUG value
        run: |
          echo "CI_HEAD_REF_SLUG=$CI_HEAD_REF_SLUG"
          # Only validate format if set
          if [ -n "$CI_HEAD_REF_SLUG" ]; then
            if echo "$CI_HEAD_REF_SLUG" | grep -qE '[^a-z0-9-]'; then
              echo "FAIL: CI_HEAD_REF_SLUG contains invalid characters: $CI_HEAD_REF_SLUG"
              exit 1
            fi
          fi
          echo "PASS"

      - name: Log CI_BASE_REF value
        run: |
          echo "CI_BASE_REF=$CI_BASE_REF"
          echo "PASS (informational)"

      - name: Log CI_BASE_REF_SLUG value
        run: |
          echo "CI_BASE_REF_SLUG=$CI_BASE_REF_SLUG"
          # Only validate format if set
          if [ -n "$CI_BASE_REF_SLUG" ]; then
            if echo "$CI_BASE_REF_SLUG" | grep -qE '[^a-z0-9-]'; then
              echo "FAIL: CI_BASE_REF_SLUG contains invalid characters: $CI_BASE_REF_SLUG"
              exit 1
            fi
          fi
          echo "PASS"

      - name: Assert CI_ACTION_REF_NAME is set
        run: |
          echo "CI_ACTION_REF_NAME=$CI_ACTION_REF_NAME"
          if [ -z "$CI_ACTION_REF_NAME" ]; then
            echo "FAIL: CI_ACTION_REF_NAME is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert CI_ACTION_REF_NAME_SLUG is set and slug-formatted
        run: |
          echo "CI_ACTION_REF_NAME_SLUG=$CI_ACTION_REF_NAME_SLUG"
          if [ -z "$CI_ACTION_REF_NAME_SLUG" ]; then
            echo "FAIL: CI_ACTION_REF_NAME_SLUG is empty"
            exit 1
          fi
          if echo "$CI_ACTION_REF_NAME_SLUG" | grep -qE '[^a-z0-9-]'; then
            echo "FAIL: CI_ACTION_REF_NAME_SLUG contains invalid characters: $CI_ACTION_REF_NAME_SLUG"
            exit 1
          fi
          echo "PASS"

      - name: Assert CI_SHA_SHORT is 8 hex characters
        run: |
          echo "CI_SHA_SHORT=$CI_SHA_SHORT"
          if [ -z "$CI_SHA_SHORT" ]; then
            echo "FAIL: CI_SHA_SHORT is empty"
            exit 1
          fi
          if ! echo "$CI_SHA_SHORT" | grep -qE '^[0-9a-f]{8}$'; then
            echo "FAIL: CI_SHA_SHORT is not 8 hex chars: $CI_SHA_SHORT"
            exit 1
          fi
          echo "PASS"

      - name: Assert CI_EVENT_NAME is set
        run: |
          echo "CI_EVENT_NAME=$CI_EVENT_NAME"
          if [ -z "$CI_EVENT_NAME" ]; then
            echo "FAIL: CI_EVENT_NAME is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert CI_ACTOR is set
        run: |
          echo "CI_ACTOR=$CI_ACTOR"
          if [ -z "$CI_ACTOR" ]; then
            echo "FAIL: CI_ACTOR is empty"
            exit 1
          fi
          echo "PASS"
